spring:
  application:
    name: inventory-service
  datasource:
    # Valores para correr desde el IDE; Compose los sobrescribe con SPRING_DATASOURCE_*.
    url: jdbc:postgresql://localhost:5441/inventory
    username: inventory
    password: inventory-demo
  jpa:
    open-in-view: false
    hibernate:
      # Flyway es el único dueño del esquema: una entidad desalineada impide el arranque.
      ddl-auto: validate
  jackson:
    # Entrada estricta, como dice el contrato: nada de propiedades desconocidas ni de 1.5 / "1" como entero.
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
    datatype:
      enum:
        # El canal es un enum de texto: 0 / 1 no deben interpretarse como ordinales (en Jackson 3 es una EnumFeature).
        fail-on-numbers-for-enums: true

server:
  port: 8081

inventory:
  jwt:
    # Sin valor por defecto: si falta JWT_SECRET el servicio no arranca.
    secret: ${JWT_SECRET:}
    issuer: retail-demo-auth

management:
  endpoints:
    web:
      exposure:
        include: health

# Swagger UI muestra el contrato escrito a mano (contrato primero), no el generado desde el código.
springdoc:
  swagger-ui:
    url: /openapi/inventory-service.yaml

logging:
  pattern:
    # Claves del MDC para seguir una venta de punta a punta.
    level: "%5p [sku=%X{sku:-}] [eventId=%X{eventId:-}]"
